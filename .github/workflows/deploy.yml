# DEP-1: build the API image and deploy it to the VPS.
#
# - On a pull request touching the image's inputs: build only (proves the Dockerfile and every
#   migration bundle still build). Nothing is pushed.
# - On a push to master (a merged PR): build, push ghcr.io/<owner>/pera-api:{latest,<sha>}, then SSH to
#   the VPS and run /srv/pera/deploy.sh — which runs the migrations, then restarts the API.
#
# The deploy job runs only when the repository has the VPS_HOST secret, so the workflow is harmless
# until the server is set up (see the runbook: dms-docs/backend/dms-modular/hosting/deploy-hostinger.md).
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key whose public half is in the VPS authorized_keys).

name: deploy

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "src/**"
      - "deploy/**"
      - "Directory.*.props"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pera-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the VPS is configured
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST is not set; skipping the deploy (the image is pushed)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to the VPS
        if: steps.vps.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /srv/pera/deploy.sh
