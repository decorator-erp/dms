services:
  postgres:
    image: postgres:17
    container_name: dms-modular-postgres
    environment:
      POSTGRES_DB: dms_modular
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host to avoid colliding with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - dms_modular_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms_modular"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dms_modular_pgdata:
